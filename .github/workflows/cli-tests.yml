name: CLI Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore CLI project
        run: dotnet restore cli/TGit.csproj

      - name: Build CLI project
        run: dotnet build cli/TGit.csproj --configuration Release --no-restore

      - name: Restore test projects
        run: |
          dotnet restore tests/TGit.Tests/TGit.Tests.csproj
          dotnet restore tests/TGit.IntegrationTests/TGit.IntegrationTests.csproj

      - name: Run CLI unit tests
        run: dotnet test tests/TGit.Tests/TGit.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Run CLI integration tests
        run: dotnet test tests/TGit.IntegrationTests/TGit.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal
