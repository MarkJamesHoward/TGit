name: Build and Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            ext: zip
            compress: true
          - rid: win-arm64
            ext: zip
            compress: true
          - rid: osx-x64
            ext: tar.gz
            compress: false
          - rid: osx-arm64
            ext: tar.gz
            compress: false
          - rid: linux-x64
            ext: tar.gz
            compress: false
          - rid: linux-arm64
            ext: tar.gz
            compress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF -replace 'refs/tags/v', '')" >> $env:GITHUB_OUTPUT

      - name: Update version in csproj
        run: |
          $content = Get-Content TGit.csproj -Raw
          $content = $content -replace '<Version>.*</Version>', "<Version>${{ steps.version.outputs.VERSION }}</Version>"
          Set-Content TGit.csproj $content

      - name: Build
        run: >
          dotnet publish TGit.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          ${{ matrix.compress == true && '-p:EnableCompressionInSingleFile=true' || '' }}
          -o publish/${{ matrix.rid }}

      - name: Sign Windows executable
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        env:
          SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGNING_CERT_PFX)
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -match "x64" } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfxPath /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "publish/${{ matrix.rid }}/tgit.exe"
          Remove-Item $pfxPath

      - name: Package (zip)
        if: matrix.ext == 'zip'
        run: Compress-Archive -Path publish/${{ matrix.rid }}/tgit.exe -DestinationPath TGit-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.${{ matrix.ext }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: tar -czf TGit-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} tgit

      - name: Calculate SHA256
        id: hash
        run: |
          $file = "TGit-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.${{ matrix.ext }}"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGit-${{ matrix.rid }}
          path: TGit-${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.${{ matrix.ext }}

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

  release:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Calculate SHA256
        id: hash
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $hashWinX64 = (Get-FileHash "artifacts/TGit-$v-win-x64.zip" -Algorithm SHA256).Hash
          $hashWinArm64 = (Get-FileHash "artifacts/TGit-$v-win-arm64.zip" -Algorithm SHA256).Hash
          $hashOsxX64 = (Get-FileHash "artifacts/TGit-$v-osx-x64.tar.gz" -Algorithm SHA256).Hash
          $hashOsxArm64 = (Get-FileHash "artifacts/TGit-$v-osx-arm64.tar.gz" -Algorithm SHA256).Hash
          $hashLinuxX64 = (Get-FileHash "artifacts/TGit-$v-linux-x64.tar.gz" -Algorithm SHA256).Hash
          $hashLinuxArm64 = (Get-FileHash "artifacts/TGit-$v-linux-arm64.tar.gz" -Algorithm SHA256).Hash
          echo "SHA256_WIN_X64=$hashWinX64" >> $env:GITHUB_OUTPUT
          echo "SHA256_WIN_ARM64=$hashWinArm64" >> $env:GITHUB_OUTPUT
          echo "SHA256_OSX_X64=$hashOsxX64" >> $env:GITHUB_OUTPUT
          echo "SHA256_OSX_ARM64=$hashOsxArm64" >> $env:GITHUB_OUTPUT
          echo "SHA256_LINUX_X64=$hashLinuxX64" >> $env:GITHUB_OUTPUT
          echo "SHA256_LINUX_ARM64=$hashLinuxArm64" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## TGit v${{ needs.build.outputs.version }}

            Git CLI wrapper with activity tracking dashboard.

            ### Installation

            **Windows (winget):**
            ```powershell
            winget install MarkJamesHoward.TGit
            ```

            **Cross-platform (.NET tool):**
            ```bash
            dotnet tool install --global TGit
            ```

            **Or download a standalone binary below.**

            ### SHA256 Checksums
            | File | SHA256 |
            |------|--------|
            | TGit-${{ needs.build.outputs.version }}-win-x64.zip | `${{ steps.hash.outputs.SHA256_WIN_X64 }}` |
            | TGit-${{ needs.build.outputs.version }}-win-arm64.zip | `${{ steps.hash.outputs.SHA256_WIN_ARM64 }}` |
            | TGit-${{ needs.build.outputs.version }}-osx-x64.tar.gz | `${{ steps.hash.outputs.SHA256_OSX_X64 }}` |
            | TGit-${{ needs.build.outputs.version }}-osx-arm64.tar.gz | `${{ steps.hash.outputs.SHA256_OSX_ARM64 }}` |
            | TGit-${{ needs.build.outputs.version }}-linux-x64.tar.gz | `${{ steps.hash.outputs.SHA256_LINUX_X64 }}` |
            | TGit-${{ needs.build.outputs.version }}-linux-arm64.tar.gz | `${{ steps.hash.outputs.SHA256_LINUX_ARM64 }}` |
          draft: false
          prerelease: false

      - name: Update version in csproj
        run: |
          $content = Get-Content TGit.csproj -Raw
          $content = $content -replace '<Version>.*</Version>', "<Version>${{ needs.build.outputs.version }}</Version>"
          Set-Content TGit.csproj $content

      - name: Pack NuGet package
        run: dotnet pack TGit.csproj -c Release -p:PackageVersion=${{ needs.build.outputs.version }} -p:PackageIcon= -o nupkg

      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: MarkHoward

      - name: Publish to NuGet
        run: dotnet nuget push (Get-ChildItem nupkg/*.nupkg).FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Update winget manifests
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $x64Hash = "${{ steps.hash.outputs.SHA256_WIN_X64 }}"
          $arm64Hash = "${{ steps.hash.outputs.SHA256_WIN_ARM64 }}"

          # Update version manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.6.0.schema.json

          PackageIdentifier: MarkJamesHoward.TGit
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ | Set-Content -Path winget/MarkJamesHoward.TGit.yaml -NoNewline

          # Update installer manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

          PackageIdentifier: MarkJamesHoward.TGit
          PackageVersion: $version
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: tgit.exe
              PortableCommandAlias: tgit
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/MarkJamesHoward/TGit/releases/download/v$version/TGit-$version-win-x64.zip
              InstallerSha256: $x64Hash
            - Architecture: arm64
              InstallerUrl: https://github.com/MarkJamesHoward/TGit/releases/download/v$version/TGit-$version-win-arm64.zip
              InstallerSha256: $arm64Hash
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ | Set-Content -Path winget/MarkJamesHoward.TGit.installer.yaml -NoNewline

          # Update locale manifest version
          $localeContent = Get-Content -Path winget/MarkJamesHoward.TGit.locale.en-US.yaml -Raw
          $localeContent = $localeContent -replace 'PackageVersion: .*', "PackageVersion: $version"
          Set-Content -Path winget/MarkJamesHoward.TGit.locale.en-US.yaml -Value $localeContent -NoNewline

      - name: Install wingetcreate
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit to winget-pkgs
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_PAT)) {
            Write-Host "::warning::WINGET_PAT secret not set - skipping winget submission"
            Write-Host "To enable automatic winget submissions:"
            Write-Host "1. Create a GitHub PAT with 'public_repo' scope at https://github.com/settings/tokens"
            Write-Host "2. Add it as a repository secret named 'WINGET_PAT'"
            Write-Host ""
            Write-Host "Manual submission info:"
            Write-Host "Version: ${{ needs.build.outputs.version }}"
            Write-Host "SHA256 x64: ${{ steps.hash.outputs.SHA256_WIN_X64 }}"
            Write-Host "SHA256 ARM64: ${{ steps.hash.outputs.SHA256_WIN_ARM64 }}"
            exit 0
          }
          ./wingetcreate.exe submit --token $env:WINGET_PAT winget
