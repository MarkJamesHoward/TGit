name: Deploy API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/azure-api-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore TGitApi.csproj
        working-directory: ./api

      - name: Build
        run: dotnet build TGitApi.csproj --configuration Release --no-restore
        working-directory: ./api

      - name: Publish
        run: dotnet publish TGitApi.csproj --configuration Release --no-build --output ./publish
        working-directory: ./api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TGit-API'
          package: ./api/publish
