name: Release and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF -replace 'refs/tags/v', '')" >> $env:GITHUB_OUTPUT

      - name: Update version in csproj
        run: |
          $content = Get-Content TGit.csproj -Raw
          $content = $content -replace '<Version>.*</Version>', "<Version>${{ steps.version.outputs.VERSION }}</Version>"
          Set-Content TGit.csproj $content

      - name: Build Windows x64
        run: dotnet publish TGit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/win-x64

      - name: Build Windows ARM64
        run: dotnet publish TGit.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/win-arm64

      - name: Build macOS x64
        run: dotnet publish TGit.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o publish/osx-x64

      - name: Build macOS ARM64
        run: dotnet publish TGit.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o publish/osx-arm64

      - name: Build Linux x64
        run: dotnet publish TGit.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/linux-x64

      - name: Build Linux ARM64
        run: dotnet publish TGit.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -o publish/linux-arm64

      - name: Create packages
        run: |
          # Windows ZIPs
          Compress-Archive -Path publish/win-x64/tgit.exe -DestinationPath TGit-${{ steps.version.outputs.VERSION }}-win-x64.zip
          Compress-Archive -Path publish/win-arm64/tgit.exe -DestinationPath TGit-${{ steps.version.outputs.VERSION }}-win-arm64.zip
          # macOS tar.gz
          tar -czf TGit-${{ steps.version.outputs.VERSION }}-osx-x64.tar.gz -C publish/osx-x64 tgit
          tar -czf TGit-${{ steps.version.outputs.VERSION }}-osx-arm64.tar.gz -C publish/osx-arm64 tgit
          # Linux tar.gz
          tar -czf TGit-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz -C publish/linux-x64 tgit
          tar -czf TGit-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz -C publish/linux-arm64 tgit

      - name: Calculate SHA256
        id: hash
        run: |
          $hashWinX64 = (Get-FileHash TGit-${{ steps.version.outputs.VERSION }}-win-x64.zip -Algorithm SHA256).Hash
          $hashWinArm64 = (Get-FileHash TGit-${{ steps.version.outputs.VERSION }}-win-arm64.zip -Algorithm SHA256).Hash
          $hashOsxX64 = (Get-FileHash TGit-${{ steps.version.outputs.VERSION }}-osx-x64.tar.gz -Algorithm SHA256).Hash
          $hashOsxArm64 = (Get-FileHash TGit-${{ steps.version.outputs.VERSION }}-osx-arm64.tar.gz -Algorithm SHA256).Hash
          $hashLinuxX64 = (Get-FileHash TGit-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz -Algorithm SHA256).Hash
          $hashLinuxArm64 = (Get-FileHash TGit-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz -Algorithm SHA256).Hash
          echo "SHA256_WIN_X64=$hashWinX64" >> $env:GITHUB_OUTPUT
          echo "SHA256_WIN_ARM64=$hashWinArm64" >> $env:GITHUB_OUTPUT
          echo "SHA256_OSX_X64=$hashOsxX64" >> $env:GITHUB_OUTPUT
          echo "SHA256_OSX_ARM64=$hashOsxArm64" >> $env:GITHUB_OUTPUT
          echo "SHA256_LINUX_X64=$hashLinuxX64" >> $env:GITHUB_OUTPUT
          echo "SHA256_LINUX_ARM64=$hashLinuxArm64" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TGit-${{ steps.version.outputs.VERSION }}-win-x64.zip
            TGit-${{ steps.version.outputs.VERSION }}-win-arm64.zip
            TGit-${{ steps.version.outputs.VERSION }}-osx-x64.tar.gz
            TGit-${{ steps.version.outputs.VERSION }}-osx-arm64.tar.gz
            TGit-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz
            TGit-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz
          body: |
            ## TGit v${{ steps.version.outputs.VERSION }}

            Git CLI wrapper with activity tracking dashboard.

            ### Installation

            **Windows (winget):**
            ```powershell
            winget install MarkJamesHoward.TGit
            ```

            **Cross-platform (.NET tool):**
            ```bash
            dotnet tool install --global TGit
            ```

            **Or download a standalone binary below.**

            ### SHA256 Checksums
            | File | SHA256 |
            |------|--------|
            | TGit-${{ steps.version.outputs.VERSION }}-win-x64.zip | `${{ steps.hash.outputs.SHA256_WIN_X64 }}` |
            | TGit-${{ steps.version.outputs.VERSION }}-win-arm64.zip | `${{ steps.hash.outputs.SHA256_WIN_ARM64 }}` |
            | TGit-${{ steps.version.outputs.VERSION }}-osx-x64.tar.gz | `${{ steps.hash.outputs.SHA256_OSX_X64 }}` |
            | TGit-${{ steps.version.outputs.VERSION }}-osx-arm64.tar.gz | `${{ steps.hash.outputs.SHA256_OSX_ARM64 }}` |
            | TGit-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz | `${{ steps.hash.outputs.SHA256_LINUX_X64 }}` |
            | TGit-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz | `${{ steps.hash.outputs.SHA256_LINUX_ARM64 }}` |
          draft: false
          prerelease: false

      - name: Pack NuGet package
        run: dotnet pack TGit.csproj -c Release -p:PackageVersion=${{ steps.version.outputs.VERSION }} -p:PackageIcon= -o nupkg

      - name: Publish to NuGet
        run: dotnet nuget push nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Update winget manifests
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $x64Hash = "${{ steps.hash.outputs.SHA256_WIN_X64 }}"
          $arm64Hash = "${{ steps.hash.outputs.SHA256_WIN_ARM64 }}"

          # Update version manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.6.0.schema.json

          PackageIdentifier: MarkJamesHoward.TGit
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ | Set-Content -Path winget/MarkJamesHoward.TGit.yaml -NoNewline

          # Update installer manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

          PackageIdentifier: MarkJamesHoward.TGit
          PackageVersion: $version
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: tgit.exe
              PortableCommandAlias: tgit
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/MarkJamesHoward/TGit/releases/download/v$version/TGit-$version-win-x64.zip
              InstallerSha256: $x64Hash
            - Architecture: arm64
              InstallerUrl: https://github.com/MarkJamesHoward/TGit/releases/download/v$version/TGit-$version-win-arm64.zip
              InstallerSha256: $arm64Hash
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ | Set-Content -Path winget/MarkJamesHoward.TGit.installer.yaml -NoNewline

          # Update locale manifest version
          $localeContent = Get-Content -Path winget/MarkJamesHoward.TGit.locale.en-US.yaml -Raw
          $localeContent = $localeContent -replace 'PackageVersion: .*', "PackageVersion: $version"
          Set-Content -Path winget/MarkJamesHoward.TGit.locale.en-US.yaml -Value $localeContent -NoNewline

      - name: Install wingetcreate
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit to winget-pkgs
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_PAT)) {
            Write-Host "::warning::WINGET_PAT secret not set - skipping winget submission"
            Write-Host "To enable automatic winget submissions:"
            Write-Host "1. Create a GitHub PAT with 'public_repo' scope at https://github.com/settings/tokens"
            Write-Host "2. Add it as a repository secret named 'WINGET_PAT'"
            Write-Host ""
            Write-Host "Manual submission info:"
            Write-Host "Version: ${{ steps.version.outputs.VERSION }}"
            Write-Host "SHA256 x64: ${{ steps.hash.outputs.SHA256_WIN_X64 }}"
            Write-Host "SHA256 ARM64: ${{ steps.hash.outputs.SHA256_WIN_ARM64 }}"
            exit 0
          }
          ./wingetcreate.exe submit --token $env:WINGET_PAT winget
